<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block titulo %}Estila{% endblock %}</title>
<link rel="stylesheet" href="/static/style.css?v=3">
</head>
{% if usuario %}
<body>
<div class="app">
  <aside class="lateral">
    <div class="marca">Estila</div>
    <div class="negocio">{{ tenant_nombre }}</div>
    <nav>
      <a href="/panel">Inicio</a>
      {% for nombre, url in menu %}<a href="{{ url }}">{{ nombre }}</a>{% endfor %}
    </nav>
  </aside>
  <div class="contenido">
    <header class="barra">
      <div><b>{{ tenant_nombre }}</b></div>
      <div class="quien">{{ usuario.nombre }} · {{ ctx.rol }} · <a href="/logout">Cerrar sesión</a></div>
    </header>
    <main>{% block contenido %}{% endblock %}</main>
  </div>
</div>
</body>
{% else %}
<body class="login-fondo">
{% block login %}{% endblock %}
</body>
{% endif %}
</html>
