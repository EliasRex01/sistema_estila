<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block titulo %}Estila{% endblock %}</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="top">
  <div class="marca">Estila · {{ tenant_nombre }}</div>
  {% if usuario %}
  <div>{{ usuario.nombre }} ({{ ctx.rol }}) · <a href="/logout">Salir</a></div>
  {% endif %}
</header>
{% if menu %}
<nav class="menu">
  <a href="/panel">Inicio</a>
  {% for nombre, url in menu %}<a href="{{ url }}">{{ nombre }}</a>{% endfor %}
</nav>
{% endif %}
<main>{% block contenido %}{% endblock %}</main>
</body>
</html>
