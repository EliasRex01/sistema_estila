{% extends "base.html" %}
{% block titulo %}Editar personal · Estila{% endblock %}
{% block contenido %}
<h2>Editar personal</h2>
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form class="card" method="post" action="/ui/personal/{{ u.id }}/guardar">
  <label>Nombre<input name="nombre" value="{{ u.nombre }}" required></label>
  <label>Correo<input name="email" type="email" value="{{ u.email }}" required></label>
  <label>Rol<select name="rol">
    <option {% if u.rol == "ESTILISTA" %}selected{% endif %}>ESTILISTA</option>
    <option {% if u.rol == "RECEPCION" %}selected{% endif %}>RECEPCION</option>
    <option {% if u.rol == "ADMIN" %}selected{% endif %}>ADMIN</option>
  </select></label>
  <label>Comisión %<input name="comision_default_pct" type="number" step="0.01" min="0" max="100" value="{{ u.comision_default_pct }}"></label>
  <label>Estado<select name="activo">
    <option value="1" {% if u.activo %}selected{% endif %}>Activo</option>
    <option value="0" {% if not u.activo %}selected{% endif %}>Inactivo</option>
  </select></label>
  <label>Nueva clave (vacío = no cambiar)<input name="password" type="password" placeholder="8+ caracteres"></label>
  <button type="submit">Guardar cambios</button>
</form>
<p><a href="/ui/personal">← Volver</a></p>
{% endblock %}
