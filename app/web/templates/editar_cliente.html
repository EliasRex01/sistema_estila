{% extends "base.html" %}
{% block titulo %}Editar cliente · Estila{% endblock %}
{% block contenido %}
<h2>Editar cliente</h2>
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form class="card" method="post" action="/ui/clientes/{{ c.id }}/guardar">
  <label>Nombre<input name="nombre" value="{{ c.nombre }}" required></label>
  <label>CI/RUC<input name="ci_ruc" value="{{ c.ci_ruc or '' }}"></label>
  <label>Teléfono<input name="telefono" value="{{ c.telefono or '' }}"></label>
  <label>Dirección<input name="direccion" value="{{ c.direccion or '' }}"></label>
  <button type="submit">Guardar cambios</button>
</form>
<p><a href="/ui/clientes">← Volver</a></p>
{% endblock %}
