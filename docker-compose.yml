services:
  db:
    # Oracle Database Free para paridad local (pesado la 1ra vez; dev simple = SQLite sin docker).
    image: gvenzl/oracle-free:23-slim
    environment:
      ORACLE_PASSWORD: EstilaLocal123
    ports:
      - "1521:1521"
    volumes:
      - oradata:/opt/oracle/oradata
  api:
    build: .
    environment:
      DATABASE_URL: oracle+oracledb://system:EstilaLocal123@db:1521/FREEPDB1
      JWT_SECRET: changeme-jwt-estila-cambiar-en-prod-32-plus
      MASTER_KEY: changeme-master-estila
    ports:
      - "8001:8000"
    depends_on:
      - db
volumes:
  oradata:
